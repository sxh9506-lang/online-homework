name: Deploy merged pull requests to test

on:
  pull_request_target:
    types: [closed]
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  deployments: write

concurrency:
  group: deploy-test-main
  cancel-in-progress: false

jobs:
  changes:
    name: Detect merged PR components without checking out code
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.number != 8
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.paths.outputs.backend }}
      frontend: ${{ steps.paths.outputs.frontend }}
    steps:
      - id: paths
        name: Read changed file names through the PR metadata API
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_FILES: ${{ github.event.pull_request.changed_files }}
        with:
          script: |
            let selection;
            try {
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: Number(process.env.PR_NUMBER),
                per_page: 100,
              });
              const expected = Number(process.env.EXPECTED_FILES);
              if (!Number.isInteger(expected) || files.length !== expected) {
                throw new Error('PR file list was incomplete; deploy both services as fallback.');
              }
              const names = files.map((file) => file.filename);
              selection = {
                backend: names.some((name) => name.startsWith('backend/')),
                frontend: names.some((name) => name.startsWith('frontend/')),
              };
              core.info(`PR file metadata selected backend=${selection.backend}, frontend=${selection.frontend}.`);
            } catch (error) {
              core.warning(`Could not safely determine changed components; deploy both services as fallback (${error.status || error.name || 'unknown error'}).`);
              selection = { backend: true, frontend: true };
            }
            core.setOutput('backend', String(selection.backend));
            core.setOutput('frontend', String(selection.frontend));

  deploy-api:
    name: Deploy API for merged PR (skip #8)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    environment:
      name: test
    steps:
      - name: Require deployment settings
        env:
          DEPLOY_HOOK_URL: ${{ secrets.TEST_API_DEPLOY_HOOK_URL }}
          HEALTH_URL: ${{ vars.TEST_API_HEALTH_URL }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOOK_URL" || (echo 'Set TEST_API_DEPLOY_HOOK_URL in the GitHub Actions test environment' >&2; exit 1)
          test -n "$HEALTH_URL" || (echo 'Set TEST_API_HEALTH_URL in the GitHub Actions test environment' >&2; exit 1)
      - name: Request API deployment
        env:
          DEPLOY_HOOK_URL: ${{ secrets.TEST_API_DEPLOY_HOOK_URL }}
        run: curl --fail --silent --show-error --request POST "$DEPLOY_HOOK_URL"
      - name: Wait for API health
        env:
          HEALTH_URL: ${{ vars.TEST_API_HEALTH_URL }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error --max-time 10 "$HEALTH_URL"; then
              echo
              echo 'API health endpoint is responding.'
              exit 0
            fi
            echo "Health check attempt ${attempt}/40 failed; retrying in 15 seconds."
            sleep 15
          done
          echo 'API did not become healthy within 10 minutes.' >&2
          exit 1

  deploy-web:
    name: Deploy web for merged PR (skip #8)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    environment:
      name: test
    steps:
      - name: Require deployment settings
        env:
          DEPLOY_HOOK_URL: ${{ secrets.TEST_WEB_DEPLOY_HOOK_URL }}
          HEALTH_URL: ${{ vars.TEST_WEB_HEALTH_URL }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOOK_URL" || (echo 'Set TEST_WEB_DEPLOY_HOOK_URL in the GitHub Actions test environment' >&2; exit 1)
          test -n "$HEALTH_URL" || (echo 'Set TEST_WEB_HEALTH_URL in the GitHub Actions test environment' >&2; exit 1)
      - name: Request web deployment
        env:
          DEPLOY_HOOK_URL: ${{ secrets.TEST_WEB_DEPLOY_HOOK_URL }}
        run: curl --fail --silent --show-error --request POST "$DEPLOY_HOOK_URL"
      - name: Wait for web health
        env:
          HEALTH_URL: ${{ vars.TEST_WEB_HEALTH_URL }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error --output /dev/null --max-time 10 "$HEALTH_URL"; then
              echo "Web health URL is responding: $HEALTH_URL"
              exit 0
            fi
            echo "Health check attempt ${attempt}/40 failed; retrying in 15 seconds."
            sleep 15
          done
          echo 'Web did not become healthy within 10 minutes.' >&2
          exit 1
