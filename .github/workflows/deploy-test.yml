name: Deploy test environment

on:
  push:
    branches: [main]

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-test-main
  cancel-in-progress: false

jobs:
  changes:
    name: Detect deployable changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.paths.outputs.backend }}
      frontend: ${{ steps.paths.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: paths
        name: Detect application changes
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            changed_files="$(git ls-tree -r --name-only "$CURRENT_SHA")"
          else
            changed_files="$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")"
          fi
          if grep -qE '^backend/' <<<"$changed_files"; then
            echo 'backend=true' >> "$GITHUB_OUTPUT"
          else
            echo 'backend=false' >> "$GITHUB_OUTPUT"
          fi
          if grep -qE '^frontend/' <<<"$changed_files"; then
            echo 'frontend=true' >> "$GITHUB_OUTPUT"
          else
            echo 'frontend=false' >> "$GITHUB_OUTPUT"
          fi

  deployment-decision:
    name: Identify exact PR #8 merge commit
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      skip: ${{ steps.association.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - id: association
        uses: actions/github-script@v7
        with:
          script: |
            const { shouldSkipPr8Merge } = require('./.github/scripts/deployment_guard.js');
            const commitSha = context.sha;
            const { data: associatedPullRequests } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: commitSha,
              per_page: 100,
            });
            const skip = shouldSkipPr8Merge({ commitSha, associatedPullRequests });
            core.setOutput('skip', skip ? 'true' : 'false');
            if (skip) {
              core.notice('Exact PR #8 merge commit confirmed; test deployment jobs will be skipped.');
            } else {
              core.info('This is not the exact PR #8 merge commit; normal deployment eligibility is preserved.');
            }

  deploy-api:
    name: Deploy API to test
    needs: [changes, deployment-decision]
    if: >-
      needs.changes.outputs.backend == 'true' &&
      needs.deployment-decision.outputs.skip != 'true'
    runs-on: ubuntu-latest
    environment:
      name: test
    steps:
      - name: Require deployment settings
        env:
          DEPLOY_HOOK_URL: ${{ secrets.TEST_API_DEPLOY_HOOK_URL }}
          HEALTH_URL: ${{ vars.TEST_API_HEALTH_URL }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOOK_URL" || (echo 'Set TEST_API_DEPLOY_HOOK_URL in the GitHub Actions test environment' >&2; exit 1)
          test -n "$HEALTH_URL" || (echo 'Set TEST_API_HEALTH_URL in the GitHub Actions test environment' >&2; exit 1)
      - name: Request API deployment
        env:
          DEPLOY_HOOK_URL: ${{ secrets.TEST_API_DEPLOY_HOOK_URL }}
        run: curl --fail --silent --show-error --request POST "$DEPLOY_HOOK_URL"
      - name: Wait for API health
        env:
          HEALTH_URL: ${{ vars.TEST_API_HEALTH_URL }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error --max-time 10 "$HEALTH_URL"; then
              echo
              echo 'API health endpoint is responding.'
              exit 0
            fi
            echo "Health check attempt ${attempt}/40 failed; retrying in 15 seconds."
            sleep 15
          done
          echo 'API did not become healthy within 10 minutes.' >&2
          exit 1

  deploy-web:
    name: Deploy web to test
    needs: [changes, deployment-decision]
    if: >-
      needs.changes.outputs.frontend == 'true' &&
      needs.deployment-decision.outputs.skip != 'true'
    runs-on: ubuntu-latest
    environment:
      name: test
    steps:
      - name: Require deployment settings
        env:
          DEPLOY_HOOK_URL: ${{ secrets.TEST_WEB_DEPLOY_HOOK_URL }}
          HEALTH_URL: ${{ vars.TEST_WEB_HEALTH_URL }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOOK_URL" || (echo 'Set TEST_WEB_DEPLOY_HOOK_URL in the GitHub Actions test environment' >&2; exit 1)
          test -n "$HEALTH_URL" || (echo 'Set TEST_WEB_HEALTH_URL in the GitHub Actions test environment' >&2; exit 1)
      - name: Request web deployment
        env:
          DEPLOY_HOOK_URL: ${{ secrets.TEST_WEB_DEPLOY_HOOK_URL }}
        run: curl --fail --silent --show-error --request POST "$DEPLOY_HOOK_URL"
      - name: Wait for web health
        env:
          HEALTH_URL: ${{ vars.TEST_WEB_HEALTH_URL }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error --output /dev/null --max-time 10 "$HEALTH_URL"; then
              echo "Web health URL is responding: $HEALTH_URL"
              exit 0
            fi
            echo "Health check attempt ${attempt}/40 failed; retrying in 15 seconds."
            sleep 15
          done
          echo 'Web did not become healthy within 10 minutes.' >&2
          exit 1
