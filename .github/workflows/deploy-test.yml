name: Deploy merged pull requests to test

on:
  pull_request_target:
    types: [closed]
    branches: [main]

permissions:
  pull-requests: read
  contents: read

jobs:
  changes:
    name: Detect merged PR components without checking out code
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.number != 8
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.paths.outputs.backend }}
      frontend: ${{ steps.paths.outputs.frontend }}
    steps:
      - id: paths
        name: Read changed file names through the PR metadata API
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # actions/github-script v7
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_FILES: ${{ github.event.pull_request.changed_files }}
        with:
          script: |
            let selection;
            try {
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: Number(process.env.PR_NUMBER),
                per_page: 100,
              });
              const expected = Number(process.env.EXPECTED_FILES);
              if (!Number.isInteger(expected) || files.length !== expected) {
                throw new Error('PR file list was incomplete; deploy both services as fallback.');
              }
              const names = files.map((file) => file.filename);
              selection = {
                backend: names.some((name) => name.startsWith('backend/')),
                frontend: names.some((name) => name.startsWith('frontend/')),
              };
              core.info(`PR file metadata selected backend=${selection.backend}, frontend=${selection.frontend}.`);
            } catch (error) {
              core.warning(`Could not safely determine changed components; deploy both services as fallback (${error.status || error.name || 'unknown error'}).`);
              selection = { backend: true, frontend: true };
            }
            core.setOutput('backend', String(selection.backend));
            core.setOutput('frontend', String(selection.frontend));

  deploy-api:
    name: Deploy API for merged PRs (skip #8)
    needs: changes
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.number != 8 &&
      needs.changes.outputs.backend == 'true'
    concurrency:
      group: deploy-test-api
      queue: max
    runs-on: ubuntu-latest
    environment:
      name: test
    steps:
      - id: resolve-target
        name: Pin the current main deployment SHA
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # actions/github-script v7
        with:
          script: |
            const { data } = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'main',
            });
            const sha = data.commit.sha;
            if (!/^[0-9a-f]{40}$/.test(sha)) {
              core.setFailed('GitHub did not return a full main deployment SHA.');
              return;
            }
            core.setOutput('sha', sha);
      - id: require-settings
        name: Require deployment hook and persistent ledger settings
        env:
          LEDGER_API_URL: ${{ vars.TEST_DEPLOYMENT_LEDGER_API_URL }}
          LEDGER_TOKEN: ${{ secrets.TEST_DEPLOYMENT_LEDGER_TOKEN }}
          DEPLOY_HOOK_URL: ${{ secrets.TEST_API_DEPLOY_HOOK_URL }}
          HEALTH_URL: ${{ vars.TEST_API_HEALTH_URL }}
        run: |
          set -euo pipefail
          test -n "$LEDGER_API_URL" || (echo 'Deployment ledger URL is not configured; deployment is blocked.' >&2; exit 1)
          case "$LEDGER_API_URL" in https://*) ;; *) echo 'Deployment ledger URL must use HTTPS.' >&2; exit 1 ;; esac
          test -n "$LEDGER_TOKEN" || (echo 'Deployment ledger token is not configured; deployment is blocked.' >&2; exit 1)
          test -n "$DEPLOY_HOOK_URL" || (echo 'API deploy hook is not configured; deployment is blocked.' >&2; exit 1)
          test -n "$HEALTH_URL" || (echo 'API health URL is not configured; deployment is blocked.' >&2; exit 1)
          python3 - <<'PY'
          import os
          import sys
          from urllib.parse import urlsplit

          for name in ("LEDGER_API_URL", "DEPLOY_HOOK_URL", "HEALTH_URL"):
              try:
                  parsed = urlsplit(os.environ[name])
                  valid = parsed.scheme == "https" and bool(parsed.hostname) and not parsed.username and not parsed.password
              except ValueError:
                  valid = False
              if not valid:
                  sys.exit(f"{name} must be an absolute HTTPS URL with a hostname and no embedded credentials.")
          PY
      - id: claim
        name: Atomically claim API delivery by repository, environment and deployment SHA
        env:
          LEDGER_API_URL: ${{ vars.TEST_DEPLOYMENT_LEDGER_API_URL }}
          LEDGER_TOKEN: ${{ secrets.TEST_DEPLOYMENT_LEDGER_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          TARGET_ENVIRONMENT: test-api
          DEPLOYMENT_SHA: ${{ steps.resolve-target.outputs.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          payload="$(jq -cn --arg repository "$REPOSITORY" --arg environment "$TARGET_ENVIRONMENT" --arg deploymentSha "$DEPLOYMENT_SHA" --argjson pullRequestNumber "$PR_NUMBER" '{repository:$repository,environment:$environment,deploymentSha:$deploymentSha,pullRequestNumber:$pullRequestNumber}')"
          response="$(curl --silent --fail --max-time 15 \
            -H "X-Deployment-Ledger-Token: $LEDGER_TOKEN" \
            -H "X-Deployment-Ledger-Repository: $REPOSITORY" \
            -H 'Content-Type: application/json' \
            --data-raw "$payload" \
            "$LEDGER_API_URL/internal/deployment-ledger/claims" 2>/dev/null)" || {
              echo 'Deployment ledger claim failed closed; no API deploy hook was sent.' >&2
              exit 1
            }
          claim_id="$(jq -er '.claimId | strings | select(length > 0)' <<<"$response")"
          acquired="$(jq -er '.acquired | tostring' <<<"$response")"
          state="$(jq -er '.status | strings' <<<"$response")"
          echo "claim_id=$claim_id" >> "$GITHUB_OUTPUT"
          echo "acquired=$acquired" >> "$GITHUB_OUTPUT"
          if [[ "$acquired" != 'true' ]]; then
            echo "Persistent ledger already records this API delivery (state=$state); skipping hook."
          fi
      - id: mark-requesting
        name: Persist REQUESTING before any deploy request
        if: steps.claim.outputs.acquired == 'true'
        env:
          LEDGER_API_URL: ${{ vars.TEST_DEPLOYMENT_LEDGER_API_URL }}
          LEDGER_TOKEN: ${{ secrets.TEST_DEPLOYMENT_LEDGER_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          CLAIM_ID: ${{ steps.claim.outputs.claim_id }}
        run: |
          set -euo pipefail
          curl --silent --fail --max-time 15 --request POST \
            -H "X-Deployment-Ledger-Token: $LEDGER_TOKEN" \
            -H "X-Deployment-Ledger-Repository: $REPOSITORY" \
            "$LEDGER_API_URL/internal/deployment-ledger/claims/$CLAIM_ID/requesting" >/dev/null 2>&1 || {
              echo 'Could not persist REQUESTING; deploy hook was not sent.' >&2
              exit 1
            }
      - id: request-hook
        name: Request API deployment once (no automatic retry)
        if: steps.claim.outputs.acquired == 'true'
        env:
          DEPLOY_HOOK_URL: ${{ secrets.TEST_API_DEPLOY_HOOK_URL }}
          DEPLOYMENT_SHA: ${{ steps.resolve-target.outputs.sha }}
        run: |
          set -euo pipefail
          status="$(curl --silent --fail --max-time 30 --retry 0 --get \
            --data-urlencode "ref=$DEPLOYMENT_SHA" --output /dev/null --write-out '%{http_code}' \
            "$DEPLOY_HOOK_URL" 2>/dev/null)" || {
              echo 'API deploy request result is ambiguous; it will be reconciled, not resent.' >&2
              exit 1
            }
          if [[ "$status" != '200' ]]; then
            echo 'API hook did not confirm a new deploy request; result is ambiguous and will not be resent.' >&2
            exit 1
          fi
      - id: mark-requested
        name: Persist deploy hook acknowledgement
        if: success() && steps.claim.outputs.acquired == 'true'
        env:
          LEDGER_API_URL: ${{ vars.TEST_DEPLOYMENT_LEDGER_API_URL }}
          LEDGER_TOKEN: ${{ secrets.TEST_DEPLOYMENT_LEDGER_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          CLAIM_ID: ${{ steps.claim.outputs.claim_id }}
        run: |
          set -euo pipefail
          curl --silent --fail --max-time 15 --request POST \
            -H "X-Deployment-Ledger-Token: $LEDGER_TOKEN" \
            -H "X-Deployment-Ledger-Repository: $REPOSITORY" \
            "$LEDGER_API_URL/internal/deployment-ledger/claims/$CLAIM_ID/requested" >/dev/null 2>&1 || {
              echo 'Ledger acknowledgement failed; REQUESTING remains blocking until reconciliation.' >&2
              exit 1
            }
      - id: wait-health
        name: Wait for API health and target commit
        if: success() && steps.claim.outputs.acquired == 'true'
        env:
          HEALTH_URL: ${{ vars.TEST_API_HEALTH_URL }}
          VERSION_PATH: /internal/deployment-version
          DEPLOYMENT_SHA: ${{ steps.resolve-target.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION_URL="$(python3 - "$HEALTH_URL" "$VERSION_PATH" <<'PY'
          import sys
          from urllib.parse import urlsplit

          parsed = urlsplit(sys.argv[1])
          print(f"{parsed.scheme}://{parsed.netloc}{sys.argv[2]}")
          PY
          )"
          for attempt in $(seq 1 40); do
            if curl --fail --silent --output /dev/null --max-time 10 "$HEALTH_URL" 2>/dev/null; then
              response="$(curl --fail --silent --show-error --max-time 10 "$VERSION_URL" 2>/dev/null)" || response=''
              served_sha="$(jq -er '.commit | strings | select(test("^[0-9a-f]{40}$"))' <<<"$response" 2>/dev/null || true)"
              if [[ "$served_sha" == "$DEPLOYMENT_SHA" ]]; then
                echo "API is healthy and serves deployment SHA $DEPLOYMENT_SHA."
                exit 0
              fi
              echo "API is healthy but does not yet serve target SHA (attempt ${attempt}/40); retrying in 15 seconds."
            else
              echo "API health check attempt ${attempt}/40 failed; retrying in 15 seconds."
            fi
            if [[ "$attempt" -lt 40 ]]; then sleep 15; fi
          done
          echo 'API did not become healthy within 10 minutes; ledger will be marked UNKNOWN.' >&2
          exit 1
      - name: Mark API result UNKNOWN after hook or health failure
        if: failure() && steps.claim.outputs.acquired == 'true' && (steps.request-hook.outcome == 'failure' || steps.wait-health.outcome == 'failure')
        env:
          LEDGER_API_URL: ${{ vars.TEST_DEPLOYMENT_LEDGER_API_URL }}
          LEDGER_TOKEN: ${{ secrets.TEST_DEPLOYMENT_LEDGER_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          CLAIM_ID: ${{ steps.claim.outputs.claim_id }}
        run: |
          if curl --silent --fail --max-time 15 --request POST \
            -H "X-Deployment-Ledger-Token: $LEDGER_TOKEN" \
            -H "X-Deployment-Ledger-Repository: $REPOSITORY" \
            "$LEDGER_API_URL/internal/deployment-ledger/claims/$CLAIM_ID/unknown" >/dev/null 2>&1; then
            echo 'Persisted UNKNOWN; automatic retry is blocked pending operator reconciliation.'
          else
            echo 'Could not update ledger; existing REQUESTING/REQUESTED state still blocks automatic retry.'
          fi
      - name: Persist API deployment success
        if: success() && steps.claim.outputs.acquired == 'true'
        env:
          LEDGER_API_URL: ${{ vars.TEST_DEPLOYMENT_LEDGER_API_URL }}
          LEDGER_TOKEN: ${{ secrets.TEST_DEPLOYMENT_LEDGER_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          CLAIM_ID: ${{ steps.claim.outputs.claim_id }}
        run: |
          set -euo pipefail
          curl --silent --fail --max-time 15 --request POST \
            -H "X-Deployment-Ledger-Token: $LEDGER_TOKEN" \
            -H "X-Deployment-Ledger-Repository: $REPOSITORY" \
            "$LEDGER_API_URL/internal/deployment-ledger/claims/$CLAIM_ID/succeeded" >/dev/null 2>&1 || {
              echo 'Could not persist success; REQUESTED remains blocking until reconciliation.' >&2
              exit 1
            }

  deploy-web:
    name: Deploy web for merged PRs (skip #8)
    needs: changes
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.number != 8 &&
      needs.changes.outputs.frontend == 'true'
    concurrency:
      group: deploy-test-web
      queue: max
    runs-on: ubuntu-latest
    environment:
      name: test
    steps:
      - id: resolve-target
        name: Pin the current main deployment SHA
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # actions/github-script v7
        with:
          script: |
            const { data } = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'main',
            });
            const sha = data.commit.sha;
            if (!/^[0-9a-f]{40}$/.test(sha)) {
              core.setFailed('GitHub did not return a full main deployment SHA.');
              return;
            }
            core.setOutput('sha', sha);
      - id: require-settings
        name: Require deployment hook and persistent ledger settings
        env:
          LEDGER_API_URL: ${{ vars.TEST_DEPLOYMENT_LEDGER_API_URL }}
          LEDGER_TOKEN: ${{ secrets.TEST_DEPLOYMENT_LEDGER_TOKEN }}
          DEPLOY_HOOK_URL: ${{ secrets.TEST_WEB_DEPLOY_HOOK_URL }}
          HEALTH_URL: ${{ vars.TEST_WEB_HEALTH_URL }}
        run: |
          set -euo pipefail
          test -n "$LEDGER_API_URL" || (echo 'Deployment ledger URL is not configured; deployment is blocked.' >&2; exit 1)
          case "$LEDGER_API_URL" in https://*) ;; *) echo 'Deployment ledger URL must use HTTPS.' >&2; exit 1 ;; esac
          test -n "$LEDGER_TOKEN" || (echo 'Deployment ledger token is not configured; deployment is blocked.' >&2; exit 1)
          test -n "$DEPLOY_HOOK_URL" || (echo 'Web deploy hook is not configured; deployment is blocked.' >&2; exit 1)
          test -n "$HEALTH_URL" || (echo 'Web health URL is not configured; deployment is blocked.' >&2; exit 1)
          python3 - <<'PY'
          import os
          import sys
          from urllib.parse import urlsplit

          for name in ("LEDGER_API_URL", "DEPLOY_HOOK_URL", "HEALTH_URL"):
              try:
                  parsed = urlsplit(os.environ[name])
                  valid = parsed.scheme == "https" and bool(parsed.hostname) and not parsed.username and not parsed.password
              except ValueError:
                  valid = False
              if not valid:
                  sys.exit(f"{name} must be an absolute HTTPS URL with a hostname and no embedded credentials.")
          PY
      - id: claim
        name: Atomically claim web delivery by repository, environment and deployment SHA
        env:
          LEDGER_API_URL: ${{ vars.TEST_DEPLOYMENT_LEDGER_API_URL }}
          LEDGER_TOKEN: ${{ secrets.TEST_DEPLOYMENT_LEDGER_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          TARGET_ENVIRONMENT: test-web
          DEPLOYMENT_SHA: ${{ steps.resolve-target.outputs.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          payload="$(jq -cn --arg repository "$REPOSITORY" --arg environment "$TARGET_ENVIRONMENT" --arg deploymentSha "$DEPLOYMENT_SHA" --argjson pullRequestNumber "$PR_NUMBER" '{repository:$repository,environment:$environment,deploymentSha:$deploymentSha,pullRequestNumber:$pullRequestNumber}')"
          response="$(curl --silent --fail --max-time 15 \
            -H "X-Deployment-Ledger-Token: $LEDGER_TOKEN" \
            -H "X-Deployment-Ledger-Repository: $REPOSITORY" \
            -H 'Content-Type: application/json' \
            --data-raw "$payload" \
            "$LEDGER_API_URL/internal/deployment-ledger/claims" 2>/dev/null)" || {
              echo 'Deployment ledger claim failed closed; no web deploy hook was sent.' >&2
              exit 1
            }
          claim_id="$(jq -er '.claimId | strings | select(length > 0)' <<<"$response")"
          acquired="$(jq -er '.acquired | tostring' <<<"$response")"
          state="$(jq -er '.status | strings' <<<"$response")"
          echo "claim_id=$claim_id" >> "$GITHUB_OUTPUT"
          echo "acquired=$acquired" >> "$GITHUB_OUTPUT"
          if [[ "$acquired" != 'true' ]]; then
            echo "Persistent ledger already records this web delivery (state=$state); skipping hook."
          fi
      - id: mark-requesting
        name: Persist REQUESTING before any deploy request
        if: steps.claim.outputs.acquired == 'true'
        env:
          LEDGER_API_URL: ${{ vars.TEST_DEPLOYMENT_LEDGER_API_URL }}
          LEDGER_TOKEN: ${{ secrets.TEST_DEPLOYMENT_LEDGER_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          CLAIM_ID: ${{ steps.claim.outputs.claim_id }}
        run: |
          set -euo pipefail
          curl --silent --fail --max-time 15 --request POST \
            -H "X-Deployment-Ledger-Token: $LEDGER_TOKEN" \
            -H "X-Deployment-Ledger-Repository: $REPOSITORY" \
            "$LEDGER_API_URL/internal/deployment-ledger/claims/$CLAIM_ID/requesting" >/dev/null 2>&1 || {
              echo 'Could not persist REQUESTING; deploy hook was not sent.' >&2
              exit 1
            }
      - id: request-hook
        name: Request web deployment once (no automatic retry)
        if: steps.claim.outputs.acquired == 'true'
        env:
          DEPLOY_HOOK_URL: ${{ secrets.TEST_WEB_DEPLOY_HOOK_URL }}
          DEPLOYMENT_SHA: ${{ steps.resolve-target.outputs.sha }}
        run: |
          set -euo pipefail
          status="$(curl --silent --fail --max-time 30 --retry 0 --get \
            --data-urlencode "ref=$DEPLOYMENT_SHA" --output /dev/null --write-out '%{http_code}' \
            "$DEPLOY_HOOK_URL" 2>/dev/null)" || {
              echo 'Web deploy request result is ambiguous; it will be reconciled, not resent.' >&2
              exit 1
            }
          if [[ "$status" != '200' ]]; then
            echo 'Web hook did not confirm a new deploy request; result is ambiguous and will not be resent.' >&2
            exit 1
          fi
      - id: mark-requested
        name: Persist deploy hook acknowledgement
        if: success() && steps.claim.outputs.acquired == 'true'
        env:
          LEDGER_API_URL: ${{ vars.TEST_DEPLOYMENT_LEDGER_API_URL }}
          LEDGER_TOKEN: ${{ secrets.TEST_DEPLOYMENT_LEDGER_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          CLAIM_ID: ${{ steps.claim.outputs.claim_id }}
        run: |
          set -euo pipefail
          curl --silent --fail --max-time 15 --request POST \
            -H "X-Deployment-Ledger-Token: $LEDGER_TOKEN" \
            -H "X-Deployment-Ledger-Repository: $REPOSITORY" \
            "$LEDGER_API_URL/internal/deployment-ledger/claims/$CLAIM_ID/requested" >/dev/null 2>&1 || {
              echo 'Ledger acknowledgement failed; REQUESTING remains blocking until reconciliation.' >&2
              exit 1
            }
      - id: wait-health
        name: Wait for web health and target commit
        if: success() && steps.claim.outputs.acquired == 'true'
        env:
          HEALTH_URL: ${{ vars.TEST_WEB_HEALTH_URL }}
          VERSION_PATH: /api/deployment-version
          DEPLOYMENT_SHA: ${{ steps.resolve-target.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION_URL="$(python3 - "$HEALTH_URL" "$VERSION_PATH" <<'PY'
          import sys
          from urllib.parse import urlsplit

          parsed = urlsplit(sys.argv[1])
          print(f"{parsed.scheme}://{parsed.netloc}{sys.argv[2]}")
          PY
          )"
          for attempt in $(seq 1 40); do
            if curl --fail --silent --output /dev/null --max-time 10 "$HEALTH_URL" 2>/dev/null; then
              response="$(curl --fail --silent --show-error --max-time 10 "$VERSION_URL" 2>/dev/null)" || response=''
              served_sha="$(jq -er '.commit | strings | select(test("^[0-9a-f]{40}$"))' <<<"$response" 2>/dev/null || true)"
              if [[ "$served_sha" == "$DEPLOYMENT_SHA" ]]; then
                echo "Web is healthy and serves deployment SHA $DEPLOYMENT_SHA."
                exit 0
              fi
              echo "Web is healthy but does not yet serve target SHA (attempt ${attempt}/40); retrying in 15 seconds."
            else
              echo "Web health check attempt ${attempt}/40 failed; retrying in 15 seconds."
            fi
            if [[ "$attempt" -lt 40 ]]; then sleep 15; fi
          done
          echo 'Web did not become healthy within 10 minutes; ledger will be marked UNKNOWN.' >&2
          exit 1
      - name: Mark web result UNKNOWN after hook or health failure
        if: failure() && steps.claim.outputs.acquired == 'true' && (steps.request-hook.outcome == 'failure' || steps.wait-health.outcome == 'failure')
        env:
          LEDGER_API_URL: ${{ vars.TEST_DEPLOYMENT_LEDGER_API_URL }}
          LEDGER_TOKEN: ${{ secrets.TEST_DEPLOYMENT_LEDGER_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          CLAIM_ID: ${{ steps.claim.outputs.claim_id }}
        run: |
          if curl --silent --fail --max-time 15 --request POST \
            -H "X-Deployment-Ledger-Token: $LEDGER_TOKEN" \
            -H "X-Deployment-Ledger-Repository: $REPOSITORY" \
            "$LEDGER_API_URL/internal/deployment-ledger/claims/$CLAIM_ID/unknown" >/dev/null 2>&1; then
            echo 'Persisted UNKNOWN; automatic retry is blocked pending operator reconciliation.'
          else
            echo 'Could not update ledger; existing REQUESTING/REQUESTED state still blocks automatic retry.'
          fi
      - name: Persist web deployment success
        if: success() && steps.claim.outputs.acquired == 'true'
        env:
          LEDGER_API_URL: ${{ vars.TEST_DEPLOYMENT_LEDGER_API_URL }}
          LEDGER_TOKEN: ${{ secrets.TEST_DEPLOYMENT_LEDGER_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          CLAIM_ID: ${{ steps.claim.outputs.claim_id }}
        run: |
          set -euo pipefail
          curl --silent --fail --max-time 15 --request POST \
            -H "X-Deployment-Ledger-Token: $LEDGER_TOKEN" \
            -H "X-Deployment-Ledger-Repository: $REPOSITORY" \
            "$LEDGER_API_URL/internal/deployment-ledger/claims/$CLAIM_ID/succeeded" >/dev/null 2>&1 || {
              echo 'Could not persist success; REQUESTED remains blocking until reconciliation.' >&2
              exit 1
            }
