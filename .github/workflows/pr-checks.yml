name: PR checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-sanity:
    name: Repository sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check patch whitespace
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "${PR_BASE_SHA}...${PR_HEAD_SHA}"
          elif [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            git diff-tree --check --root --no-commit-id -r "$CURRENT_SHA"
          else
            git diff --check "$BEFORE_SHA" "$CURRENT_SHA"
          fi
      - name: Test release readiness gate and CI-only workflow
        run: python3 .github/scripts/test_release_readiness.py

  changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.paths.outputs.backend }}
      frontend: ${{ steps.paths.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: paths
        name: Detect backend and frontend changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            changed_files="$(git diff --name-only "${PR_BASE_SHA}...${PR_HEAD_SHA}")"
          elif [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            changed_files="$(git ls-tree -r --name-only "$CURRENT_SHA")"
          else
            changed_files="$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")"
          fi
          if grep -qE '^backend/' <<<"$changed_files"; then
            echo 'backend=true' >> "$GITHUB_OUTPUT"
          else
            echo 'backend=false' >> "$GITHUB_OUTPUT"
          fi
          if grep -qE '^frontend/' <<<"$changed_files"; then
            echo 'frontend=true' >> "$GITHUB_OUTPUT"
          else
            echo 'frontend=false' >> "$GITHUB_OUTPUT"
          fi

  backend-tests:
    name: Backend tests (Java 25)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require a backend Maven project
        run: test -f backend/pom.xml || (echo 'backend/ changed but backend/pom.xml is missing' >&2; exit 1)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml
      # Configure these names as repository-level Actions secrets in this repository.
      # This step is limited to pushes and pull requests whose head is this same repository.
      - name: Verify backend with CI demo Secrets (trusted runs)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          DEMO_TEACHER_PASSWORD: ${{ secrets.ONLINE_HOMEWORK_CI_DEMO_TEACHER_PASSWORD }}
          DEMO_STUDENT_PASSWORD: ${{ secrets.ONLINE_HOMEWORK_CI_DEMO_STUDENT_PASSWORD }}
        run: |
          set -euo pipefail
          python3 .github/scripts/verify_ci_backend.py
      - name: Verify backend for fork pull requests (without Secrets)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/verify_ci_backend.py --without-ci-demo-secrets
      - name: Build backend container image
        run: docker build --file backend/Dockerfile --tag online-homework-api:ci .

  frontend-tests:
    name: Frontend checks (Next.js)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require a locked npm project
        run: |
          test -f frontend/package.json || (echo 'frontend/ changed but frontend/package.json is missing' >&2; exit 1)
          test -f frontend/package-lock.json || (echo 'frontend/package-lock.json is required for reproducible CI' >&2; exit 1)
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --prefix frontend
      - name: Lint frontend
        run: npm --prefix frontend run lint --if-present
      - name: Build frontend
        run: npm --prefix frontend run build

  release-ready:
    name: Release readiness
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    needs:
      - repository-sanity
      - changes
      - backend-tests
      - frontend-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require successful checks for changed components
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY_SANITY_RESULT: ${{ needs.repository-sanity.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          BACKEND_CHANGED: ${{ needs.changes.outputs.backend }}
          BACKEND_RESULT: ${{ needs.backend-tests.result }}
          FRONTEND_CHANGED: ${{ needs.changes.outputs.frontend }}
          FRONTEND_RESULT: ${{ needs.frontend-tests.result }}
        run: python3 .github/scripts/release_readiness.py
